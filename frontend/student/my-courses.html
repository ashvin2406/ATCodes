<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Enrolled Courses — ATCodes Student</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/custom.css">
  <script src="../js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-dark-text antialiased min-h-screen flex flex-col transition-colors duration-200">

  <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden" onclick="ATCodesUI.toggleSidebar()"></div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Student Sidebar -->
    <aside id="app-sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-white dark:bg-dark-surface border-r border-slate-200 dark:border-dark-border flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div>
        <div class="h-20 px-6 flex items-center justify-between border-b border-slate-100 dark:border-dark-border">
          <a href="dashboard.html" class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-violet-600 flex items-center justify-center text-white shadow-md">
              <i data-lucide="terminal" class="w-5 h-5"></i>
            </div>
            <div>
              <span class="text-lg font-bold tracking-tight bg-gradient-to-r from-blue-600 to-violet-600 dark:from-blue-400 dark:to-violet-400 bg-clip-text text-transparent">ATCodes</span>
              <span class="text-[10px] block font-semibold text-emerald-600 dark:text-emerald-400">Student Portal</span>
            </div>
          </a>
          <button class="md:hidden text-slate-400" onclick="ATCodesUI.toggleSidebar()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <nav class="px-3 py-6 space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Dashboard</span>
          </a>
          <a href="my-courses.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 font-bold text-xs shadow-sm">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>My Courses</span>
          </a>
          <a href="lesson.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="play-circle" class="w-4 h-4"></i>
            <span>Lesson Viewer</span>
          </a>
          <a href="practice.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="code-2" class="w-4 h-4"></i>
            <span>Practice</span>
          </a>
          <a href="assignments.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="file-check" class="w-4 h-4"></i>
            <span>Assignments</span>
          </a>
          <a href="progress.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="trending-up" class="w-4 h-4"></i>
            <span>My Progress</span>
          </a>
          <a href="profile.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card font-semibold text-xs transition-colors">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span>Profile</span>
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-100 dark:border-dark-border space-y-3">
        <div class="flex items-center gap-3 px-2">
          <div data-auth-avatar class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow">
            ST
          </div>
          <div class="overflow-hidden">
            <div data-auth-name class="text-xs font-bold text-slate-900 dark:text-white truncate">Student</div>
            <div class="flex items-center gap-1.5">
              <span data-auth-role class="text-[10px] text-slate-400 truncate">Student</span>
              <span data-auth-status class="text-[9px] px-1.5 py-0.2 rounded font-bold bg-blue-100 text-blue-700">Active</span>
            </div>
          </div>
        </div>
        <button onclick="ATCodesAuth.logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-xs font-semibold">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header class="h-20 bg-white/80 dark:bg-dark-surface/80 backdrop-blur-md border-b border-slate-200 dark:border-dark-border px-4 sm:px-8 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
          <button class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100" onclick="ATCodesUI.toggleSidebar()"><i data-lucide="menu" class="w-5 h-5"></i></button>
          <div>
            <h1 class="text-lg font-bold text-slate-900 dark:text-white">My Enrolled Courses</h1>
            <p class="text-xs text-slate-500 hidden sm:block">Courses assigned to your learning path by the instructor.</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="../courses.html" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border hover:bg-slate-100 dark:hover:bg-dark-card text-xs font-semibold text-slate-700 dark:text-slate-300">
            Browse All Courses
          </a>
          <button data-theme-toggle class="p-2.5 rounded-xl border border-slate-200 dark:border-dark-border text-slate-600 hover:bg-slate-100 dark:hover:bg-dark-card">
            <i data-lucide="moon" class="theme-toggle-icon w-4 h-4"></i>
          </button>
        </div>
      </header>

      <main class="p-4 sm:p-8 space-y-6 flex-1 max-w-7xl mx-auto w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="my-enrolled-courses-grid">
          <div class="col-span-2 py-16 text-center text-slate-400 text-xs">
            Loading enrolled courses...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await ATCodesAuth.protectRoute({ allowedRoles: ['student'], requireActive: true });

      const grid = document.getElementById('my-enrolled-courses-grid');

      try {
        const courses = await ATCodesAPI.getStudentCourses();

        if (!courses || courses.length === 0) {
          grid.innerHTML = `
            <div class="col-span-2 text-center py-16 bg-white dark:bg-dark-card rounded-3xl border border-slate-200 dark:border-dark-border space-y-3">
              <div class="w-12 h-12 mx-auto rounded-2xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 flex items-center justify-center">
                <i data-lucide="book-open" class="w-6 h-6"></i>
              </div>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">No Assigned Courses Yet</h3>
              <p class="text-xs text-slate-500 max-w-md mx-auto">You do not have any enrolled courses assigned to your account yet. Contact your instructor to be added to learning tracks.</p>
              <div class="pt-2">
                <a href="../courses.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm">
                  <span>Browse Available Courses</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>
          `;
          ATCodesUI.refreshIcons();
          return;
        }

        grid.innerHTML = courses.map((c) => {
          const lessonLink = c.firstLessonId ? `lesson.html?id=${c.firstLessonId}` : `lesson.html?courseId=${c._id}`;
          return `
            <div class="p-6 rounded-3xl bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border hover:shadow-xl transition-all space-y-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded bg-blue-50 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">
                    ${c.category}
                  </span>
                  <span class="text-xs font-semibold text-slate-400">
                    ${c.totalChapters || 0} Chapters
                  </span>
                </div>
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">${c.title}</h3>
                <p class="text-xs text-slate-500 mt-1 line-clamp-2">${c.description}</p>
              </div>

              <div class="space-y-3 pt-3 border-t border-slate-100 dark:border-dark-border">
                <div>
                  <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="text-slate-500">Curriculum Progress</span>
                    <span class="font-bold text-blue-600 dark:text-blue-400">${c.progress || 0}% (${c.completedTopics || 0}/${c.totalTopics || 0} Topics)</span>
                  </div>
                  <div class="w-full bg-slate-100 dark:bg-dark-surface rounded-full h-2 overflow-hidden">
                    <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: ${c.progress || 0}%"></div>
                  </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                  <span class="text-xs text-slate-400 flex items-center gap-1">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${c.duration || '30 hours'}
                  </span>
                  <a href="${lessonLink}" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all">
                    <span>${c.progress > 0 ? 'Continue Learning' : 'Start Course'}</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');

        ATCodesUI.refreshIcons();
      } catch (err) {
        console.warn('Courses fetch error:', err.message);
        ATCodesUI.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
